spring.application.name=purchase-tracker
spring.main.web-application-type=none

# Classroom localhost defaults, not production credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/css}
spring.datasource.username=${DB_USERNAME:css}
spring.datasource.password=${DB_PASSWORD:css}

# Execute the hand-written SQL; no generated schema or migration framework.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
