name: Java 21 tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check Java version
        run: java -version
      - name: Verify project
        run: mvn -q verify
      - name: Start Spring Boot application
        timeout-minutes: 3
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress spring-boot:run | tee target/spring-boot-run.log
          grep -F "Started Application in" target/spring-boot-run.log
